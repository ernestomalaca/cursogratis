<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tu regalo llega pronto</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<style>
:root{--negro:#111111;--tinta:#1A1A1A;--gris:#5C5C5C;--linea:#E4E4E4;--blanco:#FFFFFF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--negro);color:var(--tinta);font-family:'Poppins',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:28px 20px}
.arriba{display:block;height:80px;width:auto;max-width:90%;animation:entra .7s cubic-bezier(.2,.9,.3,1) both}
.tarjeta{width:100%;max-width:440px;background:var(--blanco);border-radius:24px;padding:26px 24px 24px;display:flex;flex-direction:column;gap:18px;animation:entra .7s cubic-bezier(.2,.9,.3,1) both,brillo 3.2s ease-in-out .7s infinite}
.marca{display:flex;justify-content:center;padding-bottom:18px;border-bottom:1.5px solid var(--linea)}
.marca img{height:72px;width:auto;max-width:100%;display:block}
.pronto{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.punto{position:relative;width:10px;height:10px;flex:none}
.punto::before,.punto::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--tinta)}
.punto::before{animation:pulso 1.8s ease-out infinite}
h1{margin:0;font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-1px}
h1 em{font-style:italic}
p{margin:0;font-size:16px;line-height:1.55}
.regalo{display:flex;align-items:center;justify-content:center;height:132px;border-radius:18px;background:#F2F2F2}
.regalo svg{width:64px;height:64px;animation:mece 2.4s ease-in-out infinite;transform-origin:50% 85%}
.secreto{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--tinta);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45;font-weight:500}
.secreto svg{flex:none;margin-top:1px}
.firma{display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:16px;border-top:1.5px solid var(--linea);font-size:13px;color:var(--gris);text-align:center}
.firma img{height:16px;width:auto;display:block}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes brillo{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.28)}50%{box-shadow:0 0 44px 4px rgba(255,255,255,.28)}}
@keyframes pulso{0%{transform:scale(1);opacity:1}70%,100%{transform:scale(2.6);opacity:0}}
@keyframes mece{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@media (prefers-reduced-motion:reduce){.tarjeta,.punto::before,.regalo svg{animation:none}}
</style>
</head>
<body>
<img class="arriba" src="img/ableton-para-la-educacion-blanco.png" alt="Ableton para la educación">
<main class="tarjeta">
  <div class="pronto"><span class="punto"></span>Muy pronto</div>
  <h1>Aquí habrá un <em>regalo</em> para ti</h1>
  <p>Si adquiriste tu licencia de Ableton Live conmigo, pronto vas a encontrar en esta página algo preparado especialmente para ti.</p>
  <div class="regalo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M3 13h18"/><path d="M12 9v12"/><path d="M12 9c-2 0-4-1-4-3s3-2 4 3c1-5 4-5 4-3s-2 3-4 3z"/></svg>
  </div>
  <div class="secreto">
    <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
    <span>Esta página es secreta. Guárdala y no la compartas con nadie.</span>
  </div>
  <div class="firma">
    <span>Ernesto Malaca</span>
    <img src="img/ableton-certified-trainer.svg" alt="Ableton Certified Trainer">
  </div>
</main>
</body>
</html>
